<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050607"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="gblur" />
      <feMerge>
        <feMergeNode in="gblur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0b1220" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />
  <!-- Subtle grid -->
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.12" />

  <!-- Flowing data wave (soft) -->
  <path d="M0 240 C200 180 400 300 600 240 C800 180 1000 300 1200 240 L1200 360 L0 360 Z"
        fill="#06202a" opacity="0.45" />

  <!-- Neural network nodes and connections (cyan) -->
  <g stroke="#49a9ff" stroke-opacity="0.9" stroke-width="1.2" fill="#49a9ff" fill-opacity="0.95">
    <!-- connections -->
    <line x1="160" y1="120" x2="260" y2="80" stroke-opacity="0.28" />
    <line x1="160" y1="120" x2="300" y2="160" stroke-opacity="0.20" />
    <line x1="300" y1="160" x2="420" y2="120" stroke-opacity="0.22" />
    <line x1="420" y1="120" x2="600" y2="140" stroke-opacity="0.18" />
    <line x1="600" y1="140" x2="860" y2="100" stroke-opacity="0.18" />
    <line x1="860" y1="100" x2="980" y2="140" stroke-opacity="0.20" />

    <!-- nodes -->
    <circle cx="160" cy="120" r="4" />
    <circle cx="260" cy="80" r="3.6" />
    <circle cx="300" cy="160" r="3.4" />
    <circle cx="420" cy="120" r="4.2" />
    <circle cx="600" cy="140" r="5" />
    <circle cx="860" cy="100" r="3.8" />
    <circle cx="980" cy="140" r="4" />
  </g>

  <!-- Digital lines (subtle) -->
  <g stroke="#0f3142" stroke-width="1" opacity="0.6">
    <path d="M0 60 L1200 20" />
    <path d="M0 90 L1200 70" />
    <path d="M0 180 L1200 150" />
  </g>

  <!-- Glowing particles -->
  <g>
    <circle cx="80" cy="60" r="24" fill="url(#particleGlow)" opacity="0.14" />
    <circle cx="330" cy="40" r="10" fill="url(#particleGlow)" opacity="0.16" />
    <circle cx="520" cy="90" r="16" fill="url(#particleGlow)" opacity="0.12" />
    <circle cx="930" cy="60" r="14" fill="url(#particleGlow)" opacity="0.10" />
    <circle cx="1080" cy="200" r="20" fill="url(#particleGlow)" opacity="0.08" />
  </g>

  <!-- Faint circuitry lines to the right -->
  <g stroke="#083143" stroke-width="1.1" opacity="0.7">
    <path d="M980 220 L980 160 L1040 160 L1040 120" />
    <circle cx="980" cy="220" r="2.6" fill="#0aa6ff" />
    <circle cx="1040" cy="120" r="2.6" fill="#0aa6ff" />
  </g>

  <!-- Main title with cyan glow -->
  <g transform="translate(0,40)">
    <text x="600" y="120" text-anchor="middle" font-family="Fira Sans, Fira Sans Condensed, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="48" fill="#cfeeff" filter="url(#textGlow)">
      SAMER MAGDY
    </text>
    <text x="600" y="168" text-anchor="middle" font-family="Fira Sans, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#9fd7ff" opacity="0.9">
      AI Engineer | Machine Learning | AI Automation
    </text>
  </g>

  <!-- Subtle accent line under title -->
  <line x1="460" y1="186" x2="740" y2="186" stroke="#58A6FF" stroke-width="1.8" stroke-opacity="0.45" />

  <!-- Small footer sparkle -->
  <circle cx="1180" cy="20" r="2.4" fill="#7ee0ff" opacity="0.7" />

</svg>
